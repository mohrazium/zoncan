name: zoncan
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.7.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  animations: ^2.0.11
  blurrycontainer: ^2.1.0
  bot_toast: ^4.1.3
  carousel_slider: ^5.0.0
  cryptology: ^0.0.6
  dart_mappable: ^4.5.0
  dev: ^1.0.0
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  eva_icons_flutter: ^3.1.0
  #  fast_i18n: ^5.12.6
  floy:
    path: /home/mohrazium/Projects/Flutter/Plugins/Floy-Workspace/floy/
  flutter_hooks: ^0.21.2
  flutter_localizations:
    sdk: flutter
  flutter_mobx: ^2.3.0
  flutter_multi_formatter: ^2.13.7
  flutter_staggered_grid_view: ^0.7.0
  fpdart: ^1.1.0
  get_it: ^7.7.0
  injectable: ^2.5.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  loading_animation_widget: ^1.2.1
  logging: ^1.2.0
  mobx: ^2.5.0
  password_policy: ^1.2.0
  path: ^1.9.1
  path_provider: ^2.1.5
  percent_indicator: ^4.2.5
  persian_datetime_picker: ^3.1.0
  persian_tools: ^1.0.3
  qlevar_router: ^1.12.0
  shamsi_date: ^1.0.4
  shared_preferences: ^2.5.3
  slang: ^4.6.0
  slang_build_runner: ^4.6.0
  slang_flutter: ^4.6.0
  # syncfusion_flutter_core: ^26.1.41
  # syncfusion_flutter_datagrid: ^26.1.41
  # syncfusion_localizations: ^26.1.41
  uuid: ^4.5.1
  validators2: ^5.0.0
  responsive_builder: ^0.7.1
  convex_bottom_bar: ^3.2.0
  flutter_svg: ^2.1.0
  flutter_popup: ^3.3.6

#!#########################
dev_dependencies:
  build: ^2.4.2
  build_runner: ^2.4.15
  dart_mappable_builder: 
  dependency_validator: 
  drift_dev: ^2.26.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.6.1
  mobx_codegen: ^2.7.0

#!#########################
flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Sahel
      fonts:
        - asset: assets/fonts/sahel/sahel.ttf
        - asset: assets/fonts/sahel/sahel_bold.ttf
        - asset: assets/fonts/sahel/sahel_black.ttf
        - asset: assets/fonts/sahel/sahel_light.ttf
        - asset: assets/fonts/sahel/sahel_semi_bold.ttf

targets:
  $default:
    builders:
      # only to resolve build_runner conflicts
      dart_mappable_builder:
        options:
          build_extensions:
            'lib/{{path}}/{{file}}.dart':
              - 'lib/{{path}}/generated/{{file}}.mapper.dart'
              - 'lib/{{path}}/generated/{{file}}.init.dart'