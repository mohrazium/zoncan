name: zoncan
description: A software for generating invoices,contracts and accounting system

publish_to: none # Remove this line if you wish to publish to pub.dev

version: 1.0.0-beta

environment:
  sdk: '>=3.0.0 <4.0.0'
#!#########################
dependencies:
  animations: ^2.0.11
  blurrycontainer: ^2.1.0
  bot_toast: ^4.1.3
  carousel_slider: ^4.2.1
  cryptology: ^0.0.6
  dart_mappable: ^4.2.2
  dev: ^1.0.0
  equatable: ^2.0.5
  eva_icons_flutter: ^3.1.0
  #  fast_i18n: ^5.12.6
  floy:
    path: /home/mohrazium/Projects/Flutter/Plugins/Floy-Workspace/floy/
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_mobx: ^2.2.1+1
  flutter_multi_formatter: ^2.12.8
  flutter_staggered_grid_view: ^0.7.0
  fpdart: ^1.1.0
  get_it: ^7.7.0
  injectable: ^2.4.2
  intl: ^0.19.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  loading_animation_widget: ^1.2.1
  logging: ^1.2.0
  mobx: ^2.3.3+2
  objectbox: ^4.0.1
  objectbox_flutter_libs: ^4.0.1
  password_policy: ^1.2.0
  path: ^1.9.0
  path_provider: ^2.1.3
  percent_indicator: ^4.2.3
  persian_datetime_picker: ^2.7.0
  persian_tools: ^1.0.3
  qlevar_router: ^1.10.3
  shamsi_date: ^1.0.2
  shared_preferences: ^2.2.3
  slang: ^3.31.1
  slang_build_runner: ^3.31.0
  slang_flutter: ^3.31.0
  syncfusion_flutter_core: ^26.1.41
  syncfusion_flutter_datagrid: ^26.1.41
  syncfusion_localizations: ^26.1.41
  uuid: ^4.4.0
  validators2: ^5.0.0
  window_manager: ^0.3.9

#!#########################
dev_dependencies:
  build: ^2.4.1
  build_runner: ^2.4.11
  dart_mappable_builder: ^4.2.3
  dependency_validator: ^4.1.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.6.1
  mobx_codegen: ^2.6.1
  objectbox_generator: ^4.0.1

#!#########################
flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Sahel
      fonts:
        - asset: assets/fonts/sahel/sahel.ttf
        - asset: assets/fonts/sahel/sahel_bold.ttf
        - asset: assets/fonts/sahel/sahel_black.ttf
        - asset: assets/fonts/sahel/sahel_light.ttf
        - asset: assets/fonts/sahel/sahel_semi_bold.ttf

objectbox:
  output_dir: core/common/src/database/generated

targets:
  $default:
    builders:
      # only to resolve build_runner conflicts
      dart_mappable_builder:
        options:
          build_extensions:
            'lib/{{path}}/{{file}}.dart':
              - 'lib/{{path}}/generated/{{file}}.mapper.dart'
              - 'lib/{{path}}/generated/{{file}}.init.dart'
